<title>Heat Map Drop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* A blank white page with the black drop logo in the middle. Nothing else on screen.
   Single light look by choice. */
:root { color-scheme: light; --ground: #ffffff; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden; touch-action: none;
  display: grid; place-items: center;
}
#stage { display: block; -webkit-tap-highlight-color: transparent; user-select: none; }
</style>

<!-- Based on "Heat map" by Bencho, MIT licence (bencho.dev/licence): the logo is drawn blurred into
     a field, and under the hand every pixel's brightness is looked up in a table of colours, so the
     colour only ever appears inside the logo's own shape. -->
<canvas id="stage" role="img" aria-label="Beach Water Check drop logo: 14 black dots. Move the pointer over it to melt the dots into colour."></canvas>

<script>
(() => {
/* ══ Settings ══════════════════════════════════════════════
   heat 70: how much heat the hand brings, and how wide
   soft 0:  the least blur the field allows, so at rest the dots are crisp
   area 10: a small patch — a multiplier on every radius the hand has,
            half at 0, as designed at 50, half again at 100; at 10 it is 0.6 */
const HEAT = 70, SOFT = 0, AREA = 10;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const spread = 0.5 + clamp(AREA, 0, 100) / 100;

/* the 14 dots of the drop logo, measured from the artwork, as a fraction of its height */
const DROP = [[0.0001,-0.5519],[-0.1300,-0.4112],[0.1361,-0.4055],[-0.2466,-0.2580],[0.2526,-0.2508],[-0.3385,-0.0912],[0.3422,-0.0834],[-0.3844,0.1025],[0.3851,0.1099],[-0.3379,0.2844],[0.3347,0.2902],[-0.1942,0.4072],[0.1883,0.4099],[-0.0074,0.4481]];
const DOT = 0.0637;  // dot radius as a fraction of the logo's height, measured from the artwork

/* ── a field, then a palette ───────────────────────────────
   The dots are drawn blurred into a grey field: bright in the
   middle of a dot, fading at its edge. Under the hand each pixel's
   brightness is looked up in a table of colours, rim (0) to core (1):
   the app's red at the soft edge, through yellow, to green and a
   dark green core. Where there is no dot there is no colour. */
const STATUS = [
  [0.0, [255, 196, 186]],
  [0.12, [255, 136, 122]],
  [0.24, [255, 92, 78]],  /* the red, faded a little: between the app's red and a soft coral */
  [0.4, [255, 214, 10]],
  [0.56, [150, 222, 70]],
  [0.7, [48, 209, 88]],
  [0.86, [16, 112, 52]],
  [1.0, [6, 44, 22]],
];
const FLOOR = 34;
/* inside a dot the colour never drops below the red band (0.24 of the way up
   the table): the cooling can pool under the hand, and below red it would
   reach the pale rim and then nothing, letting the white show through */
const RED_MIN = Math.round(FLOOR + 0.24 * (255 - FLOOR));
const LUT = new Uint8ClampedArray(256 * 4);
for (let i = 0; i < 256; i++) {
  /* under the floor: nothing, so the white shows through */
  if (i < FLOOR) continue;
  const u = (i - FLOOR) / (255 - FLOOR);
  let k = 0;
  while (k < STATUS.length - 2 && u > STATUS[k + 1][0]) k++;
  const [u0, c0] = STATUS[k], [u1, c1] = STATUS[k + 1];
  const f = clamp((u - u0) / (u1 - u0), 0, 1);
  for (let c = 0; c < 3; c++) LUT[i * 4 + c] = c0[c] + (c1[c] - c0[c]) * f;
  /* the rim fades in over the first stretch, so the edge is a glow, not a line */
  LUT[i * 4 + 3] = 255 * clamp((i - FLOOR) / 26, 0, 1);
}

/* ── and at rest, black ────────────────────────────────────
   Outside the hand the logo is the artwork itself: crisp black dots
   at their exact size and spacing, from the mask. */
const REST = [17, 17, 17];

const shown = document.getElementById('stage');
const base = document.createElement('canvas'), work = document.createElement('canvas'), mask = document.createElement('canvas');
const st = { px: -1, py: -1, tx: -1, ty: -1, power: 0, want: 0, raf: 0, swollen: false, ratio: 1, box: 300, time: 0 };

/* the canvas is a square around the logo; the page around it stays plain white */
function build() {
  const box = Math.max(1, Math.round(Math.min(innerWidth, innerHeight) * 0.62));  // never zero, even in a hidden frame
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  st.box = box;
  const w = Math.round(box * dpr);
  for (const c of [base, work, mask, shown]) { c.width = w; c.height = w; }
  shown.style.width = box + 'px'; shown.style.height = box + 'px';
  /* r: pixels per unit of the component's 300 × 170 card; the logo is 132 units tall there */
  st.ratio = (box * 0.56 / 132) * dpr;
  field();
  paint();
}

/* where each dot sits and how big it is, swollen under the hand */
function dots(w, h, r) {
  const lh = 132 * r, reach = 52 * r * spread, cx = w / 2, cy = h / 2, hx = st.px * w, hy = st.py * h;
  return DROP.map(([u, v]) => {
    const x = cx + u * lh, y = cy + v * lh;
    let rad = DOT * lh;
    /* the dots under the hand swell on a gaussian, so the nearest grow into each
       other and fuse — a little more than the component's 0.75, here 1.25 */
    if (st.power > 0.002) rad *= 1 + 1.25 * st.power * Math.exp(-(((x - hx) ** 2 + (y - hy) ** 2) / (reach * reach)));
    return [x, y, rad];
  });
}

/* the colour field: the dots blurred into a grey field, bright in the middle
   of a dot, fading at its edge. And the mask: the same dots drawn crisp, at
   the artwork's exact size and spacing, which is all that shows at rest */
function field() {
  const w = base.width, h = base.height, r = st.ratio, ds = dots(w, h, r);
  const g = base.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.shadowColor = 'transparent';
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  /* THE BLUR IS A SHADOW: drawn far off the canvas with the shadow
     thrown back on, so only the blurred shadow lands */
  const off = w * 3;
  g.shadowColor = '#fff'; g.shadowBlur = (6 + (SOFT / 100) * 16) * r; g.shadowOffsetX = off;
  g.fillStyle = '#fff';
  g.save(); g.translate(-off, 0);
  for (let pass = 0; pass < 2; pass++) for (const [x, y, rad] of ds) { g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill(); }
  g.restore();
  const mg = mask.getContext('2d');
  mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, w, h); mg.fillStyle = '#000';
  for (const [x, y, rad] of ds) { mg.beginPath(); mg.arc(x, y, rad, 0, Math.PI * 2); mg.fill(); }
}

/* one frame: the colour field, cooled at the cursor, through the palette near
   the hand; the crisp black logo everywhere else */
function paint() {
  const w = shown.width, h = shown.height, r = st.ratio;
  if (!w || !h) return;
  if (st.power > 0.002 || st.swollen) { field(); st.swollen = st.power > 0.002; }
  const g = work.getContext('2d', { willReadFrequently: true });
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.drawImage(base, 0, 0);
  const cx = st.px * w, cy = st.py * h;
  if (st.power > 0.002) {
    /* the cursor COOLS the field: a multiply that dims it toward the middle of
       the pointer, so the dark cores open into rings of green, yellow and red
       and the dots melt under the hand */
    const rad = (60 + (HEAT / 100) * 50) * r * spread;
    const amt = st.power * (0.35 + (HEAT / 100) * 0.55);
    g.globalCompositeOperation = 'multiply';
    /* a blob, not a circle: the main round at the hand plus three smaller
       ones drifting slowly around it; multiplied together their edges overlap
       unevenly, so the rings of colour wobble instead of staying round */
    const T = st.time, rounds = [[cx, cy, rad * 0.85, amt * 0.75]];
    for (let j = 0; j < 3; j++) {
      const a = T * (0.55 + 0.2 * j) + j * 2.1, d = rad * (0.32 + 0.1 * Math.sin(T * 0.8 + j));
      rounds.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d, rad * (0.5 + 0.1 * Math.sin(T * 0.9 + j * 1.7)), amt * 0.45]);
    }
    for (const [x0, y0, rr, am] of rounds) {
      const cool = g.createRadialGradient(x0, y0, 0, x0, y0, rr);
      const v = (k) => Math.round(255 * (1 - am * k));
      cool.addColorStop(0, `rgb(${v(1)},${v(1)},${v(1)})`);
      cool.addColorStop(0.45, `rgb(${v(0.6)},${v(0.6)},${v(0.6)})`);
      cool.addColorStop(1, 'rgb(255,255,255)');
      g.fillStyle = cool; g.fillRect(0, 0, w, h);
    }
  }
  const src = g.getImageData(0, 0, w, h).data;
  const mk = mask.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const out = shown.getContext('2d').createImageData(w, h);
  const d = out.data;
  /* the reveal: how much colour each pixel shows, a soft disc around the
     cursor scaled by how present the hand is; outside it the logo is black */
  const R = (95 + (HEAT / 100) * 55) * r * spread, R2 = R * R, on = st.power, T = st.time;
  /* the ripple's sines, worked out once per column and once per row rather than
     for every pixel (the diagonal term split with sin(a+b) = sin a cos b + cos a sin b) */
  const colA = new Float32Array(w), colS = new Float32Array(w), colC = new Float32Array(w);
  for (let x = 0; x < w; x++) { const nx = x / r; colA[x] = 9 * Math.sin(nx * 0.09 + T * 1.1); colS[x] = Math.sin(nx * 0.07); colC[x] = Math.cos(nx * 0.07); }
  const c09 = Math.cos(T * 0.9), s09 = Math.sin(T * 0.9), c13 = Math.cos(T * 1.3), s13 = Math.sin(T * 1.3);
  const Rmax2 = R2 * 1.2544;                       // the wobble never reaches past 1.12 R
  for (let y = 0, i = 0; y < h; y++) {
    const dy2 = (y - cy) * (y - cy), dy = y - cy;
    const ny = y / r, rowA = 7 * Math.sin(ny * 0.11 - T * 0.8), rowS = Math.sin(ny * 0.07 + T * 1.4), rowC = Math.cos(ny * 0.07 + T * 1.4);
    for (let x = 0; x < w; x++, i += 4) {
      let f = src[i];
      let m = 0;
      if (on > 0.002) {
        const dx = x - cx, dd = dx * dx + dy2;
        if (dd < Rmax2) {
          /* the edge of the coloured patch wobbles a little around the hand:
             sin(3θ + 0.9T) and sin(5θ − 1.3T), with 3θ and 5θ built from the
             direction itself instead of an angle */
          const di = dd > 0 ? 1 / Math.sqrt(dd) : 0, c = dx * di, sn = dy * di;
          const c2 = c * c, s2 = sn * sn;
          const s3 = sn * (3 - 4 * s2), c3 = c * (4 * c2 - 3);
          const s5 = sn * (16 * s2 * s2 - 20 * s2 + 5), c5 = c * (16 * c2 * c2 - 20 * c2 + 5);
          const wob = 1 + 0.07 * (s3 * c09 + c3 * s09) + 0.05 * (s5 * c13 - c5 * s13);
          const q = dd / (R2 * wob * wob);
          if (q < 1) {
            const t = 1 - q; m = on * t * t * (3 - 2 * t);
            /* and every band of colour drifts: a slow, soft ripple added to the
               field before it is looked up, so the red, yellow and green rings all
               shift a little, not only the hot middle */
            const n = colA[x] + rowA + 6 * (colS[x] * rowC + colC[x] * rowS);
            f = Math.max(0, Math.min(255, Math.round(f + n * m)));
          }
        }
      }
      const ra = mk[i + 3];                       // the crisp logo
      if (ra > 0 && f < RED_MIN) f = Math.round(f + (RED_MIN - f) * (ra / 255));
      const v = f * 4;
      if (m <= 0) { d[i] = REST[0]; d[i + 1] = REST[1]; d[i + 2] = REST[2]; d[i + 3] = ra; continue; }
      /* two parts, laid one over the other:
         the dot itself (inside its crisp outline): black turning to colour as the hand comes;
         its glow (past the outline): pure colour, never mixed with black — mixing them made a
         grey ring — and fading fast toward the edge of the patch (m cubed), so dots out at the
         edge stay plain black until the colour properly reaches them */
      const k = 1 - m;
      const cr = REST[0] * k + LUT[v] * m, cg = REST[1] * k + LUT[v + 1] * m, cb = REST[2] * k + LUT[v + 2] * m;
      const ca = ra / 255, ha = (LUT[v + 3] / 255) * m * m * m * (1 - ca), a = ca + ha;
      if (a <= 0) { d[i + 3] = 0; continue; }
      d[i] = (cr * ca + LUT[v] * ha) / a;
      d[i + 1] = (cg * ca + LUT[v + 1] * ha) / a;
      d[i + 2] = (cb * ca + LUT[v + 2] * ha) / a;
      d[i + 3] = a * 255;
    }
  }
  shown.getContext('2d').putImageData(out, 0, 0);
}

/* the loop runs only while something is moving */
function run() {
  if (st.raf) return;
  let prev = performance.now();
  const step = (t) => {
    const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
    const k = 1 - Math.pow(0.002, dt);
    st.px += (st.tx - st.px) * k; st.py += (st.ty - st.py) * k;
    st.power += (st.want - st.power) * (1 - Math.pow(0.01, dt));
    st.time += dt;
    paint();
    const still = Math.abs(st.want - st.power) < 0.004 && Math.abs(st.tx - st.px) < 0.001 && Math.abs(st.ty - st.py) < 0.001;
    if (still && st.want === 0) { st.power = 0; paint(); }
    st.raf = (still && st.want === 0) ? 0 : requestAnimationFrame(step);  // while the hand is there, the blob keeps drifting
  };
  st.raf = requestAnimationFrame(step);
}
/* the hand is tracked across the whole page, in the logo canvas's own coordinates */
const aim = (e) => { const b = shown.getBoundingClientRect(); st.tx = (e.clientX - b.left) / b.width; st.ty = (e.clientY - b.top) / b.height; };
const enter = (e) => { aim(e); if (st.power < 0.01) { st.px = st.tx; st.py = st.ty; } st.want = 1; run(); };
addEventListener('pointerdown', enter);
addEventListener('pointermove', (e) => { if (st.want === 0) enter(e); else { aim(e); run(); } });
document.documentElement.addEventListener('pointerleave', () => { st.want = 0; run(); });
addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') { st.want = 0; run(); } });
addEventListener('resize', build);
window.heatDebug = { st, paint };
build();
})();
</script>
