<title>Opening Animation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geist+Mono:wght@400&family=Geist:wght@300;400;600&display=swap">
<style>
/* Layout: phone mockup on the left, playback controls on the right; stacks on narrow screens. Single dark look by choice. */
:root {
  color-scheme: dark;
  --page: #0d0e10;
  --panel: #16181b;
  --ink: #f5f5f7;
  --muted: rgba(245, 245, 247, 0.62);
  --line: rgba(255, 255, 255, 0.12);
  --chip: rgba(255, 255, 255, 0.06);
  --text: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --dot: "Doto", "Geist Mono", ui-monospace, monospace;

  /* app tokens, from the Figma design system */
  --app-text: #f5f5f7;
  --app-text-2: rgba(255, 255, 255, 0.85);
  --app-glass-strong: rgba(255, 255, 255, 0.18);
  --app-hairline: rgba(255, 255, 255, 0.18);
}
* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.layout {
  display: flex; gap: 40px; justify-content: center; align-items: flex-start;
  flex-wrap: wrap; max-width: 1100px; margin: 0 auto;
}
.stage { flex: 0 1 402px; min-width: 0; }
.phone-wrap { position: relative; margin: 0 auto; }
.phone {
  position: absolute; top: 0; left: 0; width: 402px; height: 874px;
  transform-origin: 0 0; border-radius: 52px; overflow: hidden;
  box-shadow: 0 0 0 10px #1d1f22, 0 0 0 11px #2a2d31, 0 30px 80px rgba(0,0,0,.5);
  background: #8d939a;
}
.backdrop {
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 22% at 50% 0%, rgba(216,232,246,.95), rgba(216,232,246,0) 100%),
    radial-gradient(45% 18% at 15% 4%, rgba(207,226,244,.9), rgba(207,226,244,0) 100%),
    linear-gradient(180deg, #a8b5c2 0%, #878e95 32%, #78756f 52%, #a8a6a1 76%, #d1cfcc 100%);
}
.scroller {
  position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
}
.scroller::-webkit-scrollbar { display: none; }

/* menu bar */
.menubar {
  position: absolute; top: 62px; left: 0; right: 0; height: 44px; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  pointer-events: none;
}
.menubar .pill {
  height: 44px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center;
  background: rgba(255,255,255,.28); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  font: 400 13px/18px var(--text); color: #000; transition: color .18s;
}
.menubar .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.8); }
.menubar .logo circle { fill: #000; transition: fill .18s; }
.menubar.on-dark .pill { color: var(--app-text); background: rgba(255,255,255,.14); }
.menubar.on-dark .logo circle { fill: var(--app-text); }

/* glass sheet */
.sheet {
  --glow: 255, 214, 10;
  --glow-o: 0;
  position: relative; margin: 140px 12px 24px; border-radius: 40px; padding: 33px 25px 40px;
  background: linear-gradient(180deg, rgba(92,97,105,.72), rgba(92,97,105,.86));
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow:
    inset 0 0 30px rgba(var(--glow), calc(.6 * var(--glow-o))),
    inset 0 0 8px rgba(var(--glow), calc(.75 * var(--glow-o)));
  color: var(--app-text);
  display: flex; flex-direction: column; gap: 28px;
  overflow: hidden;
}
.mono { font: 400 12px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--app-text-2); }
.dotnum { font: 700 14px/16px var(--dot); color: var(--app-text-2); letter-spacing: .04em; }
.daterow { display: flex; align-items: center; justify-content: space-between; }
.daterow .left { display: flex; align-items: center; gap: 10px; }
.daterow .sq { width: 7px; height: 7px; border-radius: 1.5px; background: var(--app-text-2); }
.beach-block { display: flex; flex-direction: column; gap: 6px; }
.beach { font: 400 28px/34px var(--text); margin: 0; }
.beach-block .sub { min-height: 16px; } /* reserved even when the beach has no spot, so the horseshoe never moves */
.status { display: flex; flex-direction: column; gap: 20px; }
.hero { position: relative; width: 328px; height: 272px; }
.hero canvas { position: absolute; left: -36px; top: -36px; width: 400px; height: 344px; pointer-events: none; }
.hero .word {
  position: absolute; left: 0; right: 0; top: 135px; height: 48px; display: flex; align-items: center; justify-content: center;
  color: var(--app-text); will-change: filter, opacity, transform;
}
.hero .word.nodata { color: var(--app-text-2); }
.hero .word svg { display: block; overflow: visible; }
.hero .ring-label { position: absolute; left: 0; right: 0; top: 113px; text-align: center; }
.hero .loading {
  position: absolute; left: 0; right: 0; top: 151px; text-align: center;
}
.message { display: flex; flex-direction: column; gap: 8px; }
.reason { font: 400 17px/24px var(--text); }
.advice { font: 600 17px/24px var(--text); }
.updated { font: 400 13px/18px var(--text); color: var(--app-text-2); }
.hairline { height: 1px; background: var(--app-hairline); }
.source { height: 44px; display: flex; align-items: center; justify-content: space-between; }
.notice {
  display: flex; align-items: center; gap: 12px; padding: 13px 17px; border-radius: 20px;
  background: var(--app-glass-strong);
}
.notice .ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--app-text); flex: none; }
.notice .nmsg { font: 400 13px/18px var(--text); margin-top: 1px; }
.tabs { display: flex; gap: 8px; }
.tab {
  height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
  background: var(--app-glass-strong); font: 400 13px/18px var(--text); color: var(--app-text);
}
.tab .dotnum { font-size: 12px; }
.tab.active { background: var(--app-text); color: #000; }
.tab.active .dotnum { color: #000; }
.readings { display: flex; flex-direction: column; gap: 20px; }
.rhead, .rrow { display: flex; align-items: baseline; gap: 6px; }
.rhead .label, .rrow .label { flex: 1; font: 400 17px/24px var(--text); }
.rhead .val { font: 400 17px/24px var(--text); font-variant-numeric: tabular-nums; }
.rrows { display: flex; flex-direction: column; }
.rrow { height: 48px; align-items: center; border-top: 1px solid var(--app-hairline); }
.rrow .val { font: 400 17px/24px var(--text); }

/* controls */
.controls {
  flex: 1 1 320px; max-width: 440px; min-width: 0;
  display: flex; flex-direction: column; gap: 22px;
}
.group { display: flex; flex-direction: column; gap: 8px; }
.group-label { font: 400 11px/14px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--line); font: 400 13px/1 var(--text); cursor: pointer; color: var(--ink);
}
.seg label .sw { width: 8px; height: 8px; border-radius: 50%; }
.seg input:checked + label { background: var(--ink); color: #000; border-color: var(--ink); }
.seg input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
button.btn {
  height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--chip); color: var(--ink); font: 400 13px/1 var(--text); cursor: pointer;
}
button.btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
button.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.scrub { display: flex; align-items: center; gap: 12px; }
.scrub input { flex: 1; min-width: 0; accent-color: #f5f5f7; }
.scrub output { font: 400 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; width: 56px; text-align: right; }

@media (max-width: 760px) {
  .layout { gap: 28px; }
  .controls { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .menubar .pill, .menubar .logo circle { transition: none; }
}
</style>

<div class="layout">

            <div class="beach-block" data-head>

  <div class="controls">

<script>
(() => {
  const RED = [255, 69, 58], YEL = [255, 214, 10], GRN = [48, 209, 88], WHITE = [245, 245, 247];
  const DATA = {
    good:    { beach: 'Huntington State Beach', sub: '', county: 'Orange County', word: 'Good', target: .85, glow: GRN, reason: 'Bacteria levels are within the safe range.', advice: 'Good for swimming today.', updated: 'Updated 9:20 AM · Nov 15', forecast: 'Clear skies all day', ent: 12, unit: 'MPN/100 mL', sample: 'Sample 0412', rain: '0.0 in' },
    caution: { beach: 'Dockweiler State Beach', sub: 'Imperial Hwy Storm Drain', county: 'LA County', word: 'Caution', target: .55, glow: YEL, reason: 'Bacteria elevated after rain.', advice: 'Wait 24–48 hours before swimming.', updated: 'Updated 9:20 AM · Nov 15', forecast: 'Rain expected this afternoon', ent: 110, unit: 'MPN/100 mL', sample: 'Sample 0412', rain: '1.2 in' },
    poor:    { beach: 'Playa del Rey', sub: '', county: 'LA County', word: 'Poor', target: .18, glow: RED, reason: 'Bacteria far above the safe limit.', advice: 'Don’t swim today. Check back tomorrow.', updated: 'Updated 9:20 AM · Nov 15', forecast: 'More rain expected tonight', ent: 320, unit: 'MPN/100 mL', sample: 'Sample 0412', rain: '2.4 in' },
    nodata:  { beach: 'Venice Beach', sub: 'Brooks Ave', county: 'LA County', word: 'No data', target: 0, glow: null, reason: 'No recent water sample for this beach.', advice: '', updated: 'Last sample Nov 10 · 6 days ago', forecast: 'Rain expected this afternoon', ent: null, unit: 'No recent sample', sample: 'Last sample 0398', rain: '1.2 in' },
  };

  // geometry (canvas px; canvas sits 36px outside the 328×272 hero)
  const PAD = 36, CX = PAD + 164, CY = PAD + 159, R = 130, SW = 18;
  // horseshoe = the 36 dots of the reference's 46-dot outer ring (one every 360/46°) that fall inside the arc
  const RING_N = 46, RING_STEP = 360 / RING_N;
  const N = 36, TRAIL = 6, LAP = 1000;
  const A0 = 270 - (RING_STEP / 2 + 17 * RING_STEP), SPAN = 2 * (RING_STEP / 2 + 17 * RING_STEP); // ≈133.04° → 406.96°
  // opening (Ripple to ring): band reaches the rim at T_SPLIT, the inner field clears, a short pause, then the chase
  const T_SPLIT = 1000, POP = 320, RIPPLE_HOLD = 300;  // the band rolls fully through the ring, then the trail starts as the last dots fade
  const SPLIT_END = T_SPLIT + RIPPLE_HOLD;
  // glow after the reading lands: two pulses, then the static glow (value 1)
  const GLOW_KEYS = [[0, 0], [700, 1.5], [1500, .4], [2200, 1.5], [3200, 1]];
  const GLOW_LEN = 3200;
  function glowAt(t) {
    if (t <= 0) return 0;
    for (let i = 1; i < GLOW_KEYS.length; i++) {
      const [t0, v0] = GLOW_KEYS[i - 1], [t1, v1] = GLOW_KEYS[i];
      if (t <= t1) return lerp(v0, v1, (1 - Math.cos(Math.PI * (t - t0) / (t1 - t0))) / 2);
    }
    return 1;
  }
  const SLOW_AFTER = 6000;
  const MELT_STEP = 22, MELT_DUR = 380, MELT_A = .22; // leftover dots: stagger, grow time, color strength
  const FILL_SCALE = 1.4; // colored bar fills 1.4× slower than the first version (chosen in the fill speed comparison)

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const sheet = $('sheet'), word = $('word'), loadLabel = $('loadLabel');
  const heads = [...document.querySelectorAll('[data-head]')];
  const reveals = [...document.querySelectorAll('[data-reveal]')];
  const readingsIdx = reveals.indexOf($('readings'));

  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  const S = { status: 'caution', load: 1500, speed: 1, reduce: reduceMQ.matches, T: 0, playing: true };
  // edge glow color: the status color, or white for No data
  const glowColor = () => DATA[S.status].glow || WHITE;

  // ---------- math ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const eOutCubic = t => 1 - Math.pow(1 - t, 3);
  const eInCubic = t => t * t * t;
  const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const eOutBack = (t, s = 1.4) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
  const ang = p => (A0 + SPAN * p) * Math.PI / 180;
  const at = p => [CX + R * Math.cos(ang(p)), CY + R * Math.sin(ang(p))];
  const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const STOPS = [[0, RED], [.12, RED], [.40, YEL], [.58, YEL], [.82, GRN], [1, GRN]];
  function col(p) {
    for (let i = 1; i < STOPS.length; i++) {
      if (p <= STOPS[i][0]) {
        const [p0, c0] = STOPS[i - 1], [p1, c1] = STOPS[i];
        return mix(c0, c1, (p - p0) / (p1 - p0 || 1));
      }
    }
    return GRN;
  }

  // ---------- timeline ----------
  let TL;
  function buildTimeline() {
    const d = DATA[S.status];
    const t = {};
    if (S.reduce) {
      t.reveal = Math.max(500, S.load);
      t.revealEnd = t.reveal + 300;
      t.chase = 0; t.laps = 0;
    } else {
      t.chase = SPLIT_END;
      t.laps = Math.max(1, Math.ceil((S.load - SPLIT_END) / LAP)); // always at least one lap
      t.reveal = SPLIT_END + t.laps * LAP;
      t.fillDur = d.glow ? (380 + 520 * d.target) * FILL_SCALE : (N - 1) * 12 + 350;
      t.revealEnd = t.reveal + t.fillDur;
      const left = d.glow ? (N - 1) - Math.floor(d.target * (N - 1)) : 0;
      t.meltStart = t.reveal + t.fillDur * .6;
      t.mergeEnd = d.glow ? t.meltStart + Math.max(0, left - 1) * MELT_STEP + MELT_DUR : t.revealEnd;
    }
    t.word = S.reduce ? t.reveal : t.reveal + (t.fillDur || 0) * .5;
    t.glow = S.reduce ? t.reveal : t.revealEnd - 80;
    t.content = S.reduce ? t.reveal : t.revealEnd - 120;
    t.total = S.reduce ? t.revealEnd + 500 : Math.max(t.revealEnd + 1300, t.mergeEnd + 400, t.glow + GLOW_LEN + 200);
    TL = t;
    $('scrub').max = Math.round(t.total);
    const ph = {
      ping: [0, T_SPLIT], split: [T_SPLIT, SPLIT_END], chase: [t.chase, t.reveal],
      fill: [t.reveal, t.revealEnd], settle: [t.revealEnd, t.total],
    };
    if (S.reduce) { ph.ping = ph.split = ph.chase = null; ph.fill = [t.reveal, t.revealEnd]; }
    TL.ph = ph;
  }

  // ---------- copy ----------
  // Status word: 7-row round-dot matrix (lit dots only), like a departures board. I and space are 3 columns wide.
  const GLYPHS = {
    A: ['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
    C: ['.###.','#...#','#....','#....','#....','#...#','.###.'],
    D: ['####.','#...#','#...#','#...#','#...#','#...#','####.'],
    G: ['.###.','#...#','#....','#.###','#...#','#...#','.####'],
    I: ['###','.#.','.#.','.#.','.#.','.#.','###'],
    N: ['#...#','##..#','#.#.#','#..##','#...#','#...#','#...#'],
    O: ['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
    P: ['####.','#...#','#...#','####.','#....','#....','#....'],
    R: ['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],
    T: ['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
    U: ['#...#','#...#','#...#','#...#','#...#','#...#','.###.'],
    ' ': ['...','...','...','...','...','...','...'],
  };
  const DOT_PITCH = 5.1, DOT_R = 2.0, CELL_GAP = 1; // gap between letters, in dot columns
  function matrixSVG(text) {
    const chars = [...text.toUpperCase()];
    let col = 0, dots = '';
    chars.forEach((ch, i) => {
      const g = GLYPHS[ch] || GLYPHS[' '], x0 = col;
      g.forEach((row, y) => [...row].forEach((c, x) => {
        if (c === '#') dots += `<circle cx="${(DOT_R + (x0 + x) * DOT_PITCH).toFixed(2)}" cy="${(DOT_R + y * DOT_PITCH).toFixed(2)}" r="${DOT_R}"/>`;
      }));
      col += g[0].length + (i < chars.length - 1 ? CELL_GAP : 0);
    });
    const w = (col - 1) * DOT_PITCH + DOT_R * 2, h = 6 * DOT_PITCH + DOT_R * 2;
    return `<svg width="${w.toFixed(1)}" height="${h.toFixed(1)}" viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" fill="currentColor" aria-hidden="true">${dots}</svg>`;
  }

  function applyCopy() {
    const d = DATA[S.status];
    word.innerHTML = matrixSVG(d.word);
    word.setAttribute('role', 'img');
    word.setAttribute('aria-label', d.word);
    $('beachName').textContent = d.beach;
    $('beachSub').textContent = d.sub || '\u00A0';
    $('county').textContent = d.county;
    word.classList.toggle('nodata', !d.glow);
    $('reason').textContent = d.reason;
    $('advice').textContent = d.advice;
    $('advice').hidden = !d.advice;
    $('updated').textContent = d.updated;
    $('forecast').textContent = d.forecast;
    $('entUnit').textContent = d.unit;
    $('sample').textContent = d.sample;
    $('rain').textContent = d.rain;
    if (glowColor()) sheet.style.setProperty('--glow', glowColor().join(','));
  }

  // ---------- drawing ----------
  const hasConic = typeof ctx.createConicGradient === 'function';
  let conicCache = null;
  function conic() {
    if (conicCache) return conicCache;
    const g = ctx.createConicGradient(ang(0), CX, CY);
    for (const [p, c] of STOPS) g.addColorStop(p * SPAN / 360, rgba(c, 1));
    g.addColorStop(SPAN / 360 + .04, rgba(GRN, 1));
    g.addColorStop(.97, rgba(RED, 1));
    g.addColorStop(1, rgba(RED, 1));
    return (conicCache = g);
  }
  function gradArc(p0, p1, alpha) {
    if (p1 - p0 < .001 || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = SW; ctx.lineCap = 'round';
    if (hasConic) {
      ctx.strokeStyle = conic();
      ctx.beginPath(); ctx.arc(CX, CY, R, ang(p0), ang(p1)); ctx.stroke();
    } else {
      const steps = Math.max(2, Math.ceil((p1 - p0) * 90));
      for (let i = 0; i < steps; i++) {
        const a = p0 + (p1 - p0) * i / steps, b = p0 + (p1 - p0) * (i + 1) / steps;
        ctx.strokeStyle = rgba(col((a + b) / 2), 1);
        ctx.lineCap = i === 0 || i === steps - 1 ? 'round' : 'butt';
        ctx.beginPath(); ctx.arc(CX, CY, R, ang(a), ang(b) + .004); ctx.stroke();
      }
    }
    ctx.restore();
  }
  function greyArc(alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.lineWidth = SW; ctx.lineCap = 'round'; ctx.strokeStyle = rgba([255, 255, 255], .18 * alpha);
    ctx.beginPath(); ctx.arc(CX, CY, R, ang(0), ang(1)); ctx.stroke();
    ctx.restore();
  }
  function dot(x, y, r, c, a, shadow) {
    if (r <= .1 || a <= 0) return;
    ctx.save();
    if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; }
    ctx.fillStyle = rgba(c, a);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function ring(r, a) {
    if (a <= 0) return;
    ctx.save(); ctx.strokeStyle = rgba(WHITE, a); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  const DIM_R = 2.6, DIM_A = .32;

  function fillAt(T) {
    const d = DATA[S.status];
    const u = clamp((T - TL.reveal) / TL.fillDur);
    return d.target * (1 - (1 - u) * (1 - u)); // ease-out, no overshoot, so it hands off to the dot sweep without stopping
  }

  // ---------- opening: Ripple to ring ----------
  // Exact dot layout from the reference still: 161 inner dots + a 46-dot outer ring on the horseshoe's circle.
  // A band of bigger dots expands to the rim; the 36 rim dots inside the arc are the horseshoe dots.
  const REF_INNER = [[-0.0685,-0.8721],[0.0686,-0.8722],[-0.2044,-0.8505],[0.2043,-0.8506],[-0.3348,-0.8083],[0.3349,-0.8081],[0.0692,-0.7465],[-0.4574,-0.7459],[-0.0692,-0.7465],[0.4573,-0.7459],[-0.2052,-0.7215],[0.2051,-0.7214],[0.334,-0.6717],[-0.3341,-0.6712],[-0.5684,-0.6653],[0.5683,-0.6653],[-0.034,-0.6241],[0.1011,-0.6165],[-0.1673,-0.6028],[-0.4525,-0.5975],[0.4521,-0.5984],[0.2316,-0.5807],[-0.6653,-0.5681],[0.6652,-0.5682],[-0.2927,-0.5521],[0.3507,-0.5169],[-0.5542,-0.5051],[0.5545,-0.5051],[-0.0335,-0.4984],[0.1015,-0.4893],[-0.4048,-0.4761],[-0.1671,-0.4709],[-0.7468,-0.457],[0.7462,-0.457],[0.2299,-0.4437],[0.4538,-0.43],[-0.2882,-0.4081],[-0.6376,-0.3948],[0.6377,-0.395],[-0.4975,-0.3779],[-0.0344,-0.3733],[0.3414,-0.3654],[0.1029,-0.3605],[-0.8086,-0.3348],[-0.1674,-0.3357],[0.8086,-0.3349],[0.5356,-0.322],[-0.3879,-0.3157],[0.2261,-0.2989],[-0.6993,-0.2709],[0.6995,-0.2711],[-0.5678,-0.2625],[0.4275,-0.2597],[-0.2776,-0.2525],[-0.0355,-0.247],[0.1042,-0.2278],[-0.8513,-0.2045],[0.8508,-0.204],[-0.4587,-0.1992],[0.5925,-0.1995],[0.3187,-0.1979],[-0.1638,-0.1886],[-0.7372,-0.1379],[0.7373,-0.1381],[-0.6106,-0.1344],[-0.3497,-0.1355],[0.21,-0.1351],[0.4818,-0.1349],[0.0001,-0.1249],[-0.8723,-0.0686],[-0.2397,-0.0703],[0.3684,-0.0687],[0.6215,-0.0677],[0.8726,-0.0686],[-0.4954,-0.068],[0.1081,-0.0625],[-0.1079,-0.0622],[-0.7501,-0.0002],[-0.6253,0.0002],[-0.3745,-0.0],[0.0002,-0.0003],[0.25,-0.0004],[0.5003,-0.0],[0.7498,0.0003],[-0.1082,0.0624],[0.108,0.0625],[0.6215,0.0672],[-0.8723,0.0687],[-0.4952,0.0679],[-0.24,0.0705],[0.3685,0.0689],[0.8726,0.0689],[0.0001,0.1252],[-0.6105,0.1345],[-0.3497,0.1355],[0.2102,0.1351],[0.4816,0.1348],[-0.7371,0.138],[0.7374,0.1381],[-0.1639,0.1887],[0.3189,0.1971],[-0.4587,0.1993],[0.5924,0.1995],[-0.8511,0.2042],[0.8509,0.2042],[0.1042,0.2275],[-0.0356,0.2472],[-0.2771,0.2522],[0.4277,0.2597],[-0.5673,0.2622],[-0.6992,0.2708],[0.6995,0.2708],[0.226,0.2997],[-0.3877,0.3159],[0.5354,0.3224],[-0.8085,0.3349],[-0.1673,0.3356],[0.8086,0.3349],[0.1024,0.3608],[0.3412,0.3654],[-0.0345,0.3732],[-0.4973,0.3782],[-0.6378,0.3947],[0.6381,0.395],[-0.2885,0.4083],[0.4538,0.4298],[0.2301,0.4437],[-0.7465,0.457],[0.7463,0.4569],[-0.1674,0.471],[-0.4045,0.4763],[0.1017,0.4889],[-0.034,0.4991],[-0.5543,0.5053],[0.5547,0.5052],[0.3504,0.5172],[-0.2926,0.5523],[-0.6653,0.5682],[0.6653,0.5681],[0.2317,0.5805],[-0.4522,0.5984],[0.4519,0.5982],[-0.1676,0.602],[0.101,0.6163],[-0.034,0.624],[-0.5686,0.6653],[0.5684,0.6651],[-0.3342,0.671],[0.3345,0.6712],[-0.2052,0.7213],[0.2057,0.7214],[-0.4574,0.7459],[0.0693,0.7466],[0.4573,0.746],[-0.0691,0.7465],[-0.3348,0.8082],[0.335,0.8081],[-0.2044,0.8506],[0.2042,0.8503],[-0.0688,0.872],[0.0687,0.8721]];
  const RIP_IN = REF_INNER.map(([u, v]) => ({ x: CX + u * R, y: CY + v * R, rho: Math.hypot(u, v) }));
  // the horseshoe's ring dots: their brightness is shared with the chase so the hand-off is continuous
  const RIM_FADE = 450, RIM_NOW = { r: DIM_R, a: DIM_A };
  const RIP_OUT = Array.from({ length: RING_N }, (_, k) => {
    const deg = k * RING_STEP, rad = deg * Math.PI / 180, off = ((deg - A0) % 360 + 360) % 360;
    return { x: CX + R * Math.cos(rad), y: CY + R * Math.sin(rad), slot: off <= SPAN + .01 };
  });
  function drawRipple(T) {
    const fin = clamp(T / 250);
    const u = Math.max(0, (T - 100) / (T_SPLIT - 100));
    // band speeds up into the ring and keeps going past it at the same speed, so the lit rings
    // behind its center reach the ring one after another (ring + 2, ring + 1, ring alone)
    const w = u <= 1 ? u * (.65 + .35 * u) : 1 + 1.35 * (u - 1);
    // the band starts dimming just before it reaches the ring, so its brightness peaks with a rounded top, not a sharp corner
    const fadeBand = 1 - clamp((w - 1.5) / .3);                     // only once the band is fully past the ring
    // fade front: the band's own path, 250 ms behind it, so each dot lights up and then fades
    // right after the band passes; the bottom ring dots (furthest out) still fade last
    const FADE_LAG = 300, FADE_W = .35;
    const fu = (T - 100 - FADE_LAG) / (T_SPLIT - 100), fw = fu <= 1 ? fu * (.65 + .35 * fu) : 1 + 1.35 * (fu - 1);
    const fadeAt = rho => { const t = clamp((fw - rho) / FADE_W); return (1 - Math.cos(Math.PI * t)) / 2; };
    const band = rho => Math.exp(-Math.pow((rho - w) / .28, 2))  /* wide band, like the reference */ * fadeBand;
    for (const q of RIP_IN) {
      const d = fu > 0 ? fadeAt(q.rho) : 0;                            // fades as the front passes, center first
      if (d >= 1) continue;
      const b = band(q.rho);
      dot(q.x, q.y, 1.5 * (1 + .8 * b) * (1 - .4 * d), WHITE, (.45 + .5 * b) * fin * (1 - d));
    }
    for (const q of RIP_OUT) {
      const b = band(1);
      let r = 2.1 * (1 + .5 * b), a = Math.min(1, .6 + .4 * b) * fin;
      if (q.slot) {                                                   // ease into the horseshoe's dim dots over 600 ms
        const k = (1 - Math.cos(Math.PI * clamp((T - (T_SPLIT + 50)) / RIM_FADE))) / 2;  // dims once the band's center has passed
        r = lerp(r, DIM_R, k); a = lerp(a, DIM_A, k);
        RIM_NOW.r = r; RIM_NOW.a = a;                                 // the chase picks up from exactly here
        if (T >= TL.chase) continue;
      } else {                                                        // the 10 dots in the bottom gap fade away
        const g = fu > 0 ? fadeAt(1) : 0; /* bottom-gap ring dots fade last */ r *= 1 - g * .6; a *= 1 - g; if (g >= 1) continue;
      }
      dot(q.x, q.y, r, WHITE, a);
    }
  }

  function drawMotion(T) {
    const d = DATA[S.status];
    drawRipple(T);

    const revealing = T >= TL.reveal;
    const f = revealing && d.glow ? fillAt(T) : 0;
    const filling = revealing && T < TL.revealEnd;
    // after the fill lands, leftover dots sweep into colored dots, then the solid faint track fades in
    const firstLeft = Math.floor(d.target * (N - 1)) + 1;
    const trackIn = d.glow ? eInOut(clamp((T - (TL.mergeEnd - 350)) / 450)) : 0;

    // track under everything once it settles
    if (d.glow) gradArc(0, 1, .14 * trackIn);
    else greyArc(clamp((T - (TL.revealEnd - 150)) / 250));

    // dots
    const lapPos = T >= TL.chase && T < TL.reveal ? ((T - TL.chase) % LAP) / LAP * (N - 1 + TRAIL) : -99;
    for (let i = 0; i < N; i++) {
      const p = i / (N - 1);
      const born = T_SPLIT;
      if (T < born || T < TL.chase) continue; // before the chase, the ripple's own rim dots are drawn instead
      const [x, y] = at(p);
      // sweep: each dot pops in at its place, bright first, then dims
      const ft = clamp((T - born) / POP);
      let r = ft < .35 ? 4.4 * eOutBack(ft / .35, 1.6) : lerp(4.4, DIM_R, eOutCubic((ft - .35) / .65));
      let a = ft < .35 ? 1 : lerp(1, DIM_A, eOutCubic((ft - .35) / .65)), c = WHITE;

      if (lapPos > -99) {
        const dd = lapPos - i;
        const lit = (dd >= 0 && dd < TRAIL ? Math.pow(1 - dd / TRAIL, 1.4) : 0) * (1 - Math.cos(Math.PI * clamp((T - TL.chase) / 150))) / 2;  // trail fades in over 150 ms
        const settling = T < T_SPLIT + 50 + RIM_FADE, br = settling ? RIM_NOW.r : DIM_R, ba = settling ? RIM_NOW.a : DIM_A;
        r = br + 3.2 * lit; a = ba + (1 - ba) * lit;
      }

      if (revealing) {
        if (d.glow) {
          if (p <= f) continue;                       // swallowed by the fill
          const ahead = (p - f) * (N - 1);
          if (ahead < 3.5) {                            // colored dots leading the fill
            const lead = 1 - ahead / 3.5;
            c = col(p); r = lerp(DIM_R, 7, lead); a = lerp(DIM_A, 1, Math.min(1, lead * 1.6));
          }
          // the sweep starts while the fill is still easing in, so the motion never stops
          const m = eOutCubic(clamp((T - TL.meltStart - (i - firstLeft) * MELT_STEP) / MELT_DUR));
          if (m > 0) { c = mix(c, col(p), m); r = lerp(r, SW / 2, m); a = lerp(a, MELT_A, m); }
          a *= 1 - trackIn;
        } else {
          const m = eInOut(clamp((T - TL.reveal - i * 12) / 350));
          const fade = 1 - clamp((T - (TL.revealEnd - 150)) / 250);
          r = lerp(DIM_R, SW / 2, m); a = lerp(DIM_A, .18, m) * fade;
        }
      }
      dot(x, y, r, c, a);
    }

    // fill + reading dot
    if (revealing && d.glow) {
      gradArc(0, Math.max(f, .0011), 1);
      const [tx, ty] = at(Math.max(f, 0));
      const tipK = clamp((T - TL.reveal) / 240);
      dot(tx, ty, 13 * (.6 + .4 * eOutCubic(tipK)), WHITE, eOutCubic(tipK), true);
    }
  }

  function drawFinal(alpha) {
    const d = DATA[S.status];
    if (!d.glow) { greyArc(alpha); return; }
    gradArc(0, 1, .14 * alpha);
    gradArc(0, d.target, alpha);
    const [tx, ty] = at(d.target);
    dot(tx, ty, 13, WHITE, alpha, true);
  }

  function drawReduced(T) {
    const a = clamp((T - TL.reveal) / 300);
    const pulse = .22 + .12 * (.5 + .5 * Math.sin(T / 500));
    for (let i = 0; i < N; i++) {
      const [x, y] = at(i / (N - 1));
      dot(x, y, DIM_R, WHITE, pulse * (1 - a));
    }
    drawFinal(a);
  }

  // ---------- frame ----------
  function render(T) {
    const d = DATA[S.status];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 400, 344);
    if (S.reduce) drawReduced(T); else drawMotion(T);

    // sheet entrance + header
    const open = S.reduce ? 1 : eOutCubic(clamp(T / 450));
    sheet.style.opacity = S.reduce ? 1 : open;
    sheet.style.transform = `translateY(${(1 - open) * 40}px)`;
    heads.forEach((el, i) => {
      const o = S.reduce ? 1 : eOutCubic(clamp((T - 80 - i * 60) / 350));
      el.style.opacity = o;
    });

    // loading label
    let lab = 0;
    if (S.reduce) lab = 1 - clamp((T - TL.reveal) / 200);
    else lab = Math.min(eOutCubic(clamp((T - SPLIT_END) / 250)), 1 - eOutCubic(clamp((T - TL.reveal) / 200)));
    loadLabel.style.opacity = lab;
    loadLabel.textContent = !S.reduce && T - TL.chase > SLOW_AFTER ? 'Still checking' : 'Checking water';

    // status word
    const w = clamp((T - TL.word) / (S.reduce ? 300 : 420));
    const we = eOutCubic(w);
    word.style.opacity = we * (d.glow ? 1 : 1);
    word.style.filter = S.reduce ? 'none' : `blur(${(1 - we) * 12}px)`;
    word.style.transform = S.reduce ? 'none' : `scale(${1.06 - .06 * we})`;
    $('ringLabel').style.opacity = we;

    // glow
    const g = !glowColor() ? 0 : S.reduce ? eOutCubic(clamp((T - TL.glow) / 600)) : glowAt(T - TL.glow);
    sheet.style.setProperty('--glow-o', g.toFixed(3));

    // details rise in
    reveals.forEach((el, k) => {
      const t0 = TL.content + (S.reduce ? 0 : k * 55);
      const o = eOutCubic(clamp((T - t0) / (S.reduce ? 300 : 380)));
      el.style.opacity = o;
      el.style.transform = S.reduce ? 'none' : `translateY(${(1 - o) * 14}px)`;
    });
    const entEl = $('ent');
    if (d.ent == null) entEl.textContent = '—';
    else {
      const t0 = TL.content + (S.reduce ? 0 : readingsIdx * 55);
      const c = S.reduce ? 1 : eOutCubic(clamp((T - t0) / 700));
      entEl.textContent = Math.round(d.ent * c);
    }

    // controls
    $('scrub').value = Math.round(T);
    $('clock').value = (T / 1000).toFixed(2) + ' s';
    $('clock').textContent = (T / 1000).toFixed(2) + ' s';
  }

  // ---------- loop ----------
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(50, now - last); last = now;
    if (S.playing) {
      S.T += dt * S.speed;
      if (S.T >= TL.total) { S.T = TL.total; S.playing = false; syncPause(); }
    }
    render(S.T);
    requestAnimationFrame(tick);
  }
  function syncPause() { $('pause').textContent = S.playing ? 'Pause' : (S.T >= TL.total ? 'Done' : 'Play'); }
  function restart() { conicCache = null; applyCopy(); buildTimeline(); S.T = 0; S.playing = true; syncPause(); $('scroller').scrollTop = 0; }

  // ---------- controls ----------
  document.querySelectorAll('input[name=status]').forEach(el => el.addEventListener('change', () => { S.status = el.value; restart(); }));
  document.querySelectorAll('input[name=load]').forEach(el => el.addEventListener('change', () => { S.load = +el.value; restart(); }));
  document.querySelectorAll('input[name=speed]').forEach(el => el.addEventListener('change', () => { S.speed = +el.value; }));
  $('replay').addEventListener('click', restart);
  $('pause').addEventListener('click', () => {
    if (S.T >= TL.total) { restart(); return; }
    S.playing = !S.playing; syncPause();
  });
  $('scrub').addEventListener('input', e => { S.T = +e.target.value; S.playing = false; syncPause(); });
  $('scroller').addEventListener('scroll', e => {
    $('menubar').classList.toggle('on-dark', e.target.scrollTop > 80);
  });

  // ---------- logo: water drop drawn in 14 dots ----------
  (() => {
    const svg = $('logo'); const n = 14; let out = '';
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const x = 14 + 11.5 * Math.sin(t) * Math.sin(t / 2);
      const y = 16.5 - 14.5 * Math.cos(t);
      out += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.7"/>`;
    }
    svg.innerHTML = out;
  })();

  // ---------- sizing ----------
  let dpr = 1;
  function size() {
    const wrap = $('phoneWrap');
    const avail = wrap.parentElement.clientWidth;
    const hScale = Math.max(.6, (innerHeight - 48) / 874);
    const s = Math.min(1, avail / 402, hScale);
    wrap.style.width = 402 * s + 'px';
    wrap.style.height = 874 * s + 'px';
    $('phone').style.transform = `scale(${s})`;
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = 400 * dpr; cv.height = 344 * dpr;
    conicCache = null;
  }
  addEventListener('resize', size);
  size();
  applyCopy();
  buildTimeline();
  requestAnimationFrame(t => { last = t; tick(t); });
  // hook for stepping frames by hand while reviewing
  window.loaderDebug = { S, render, restart, get timeline() { return TL; } };
  // #t-1900-caution-l1500 opens paused at 1.9 s with that reading and load time
  const m = location.hash.match(/^#t-(\d+)(?:-(good|caution|poor|nodata))?(?:-l(\d+))?(-rm)?$/);
  if (m) {
    if (m[2]) { S.status = m[2]; document.getElementById('st-' + m[2]).checked = true; }
    if (m[3]) S.load = +m[3];
    if (m[4]) { S.reduce = true; }
    restart(); S.T = Math.min(+m[1], TL.total); S.playing = false; syncPause();
  }
})();
</script>
