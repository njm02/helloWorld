<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <title>Erosion — a clock for the passing day</title>
  <link rel="stylesheet" href="style.css">
  <script src="libraries/p5.min.js" defer></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p id="date">THE PASSING DAY</p><h1><span id="time">—:—:—</span><span id="period">AM</span></h1><p id="preview-status" hidden>PREVIEW · A MOMENT IN THE DAY</p></div>
      <div class="progress"><p id="progress-label">0% OF DAY</p><div class="track" role="progressbar" aria-label="Day elapsed" aria-valuemin="0" aria-valuemax="100"><span id="progress-fill"></span></div></div>
    </header>
    <div id="art"></div>
    <p class="orbit-hint">DRAG TO ORBIT · R TO RESET VIEW</p>
    <section id="preview" aria-label="Preview time of day" hidden>
      <div class="timeline-label"><label for="timeline">EXPLORE THE DAY</label><span>PREVIEW</span></div>
      <input id="timeline" type="range" min="0" max="86399" step="1" value="43200" aria-label="Preview time">
      <div class="timeline-label"><span>12:00 am</span><span>NOON</span><span>11:59 pm</span></div>
    </section>
    <footer><div class="signature">EROSION<span>A STUDY OF TIME & WATER</span></div><nav aria-label="Artwork controls"><button id="preview-toggle" aria-pressed="false"><kbd>P</kbd> Preview the day</button><button id="theme-toggle" aria-pressed="false"><kbd>D</kbd> <span id="theme-label">Dark mode</span></button></nav></footer>
  </main>
</body>
</html>
